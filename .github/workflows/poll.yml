name: poll-gdebenz
on:
  schedule:
    - cron: '*/15 * * * *'   # резервный старт (best-effort у GitHub)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Poll 3 sources every 5 min (~20 min)
        run: |
          git config user.name "poller"
          git config user.email "actions@github.com"
          UA="info_day/1.0 (+github.com/hulapik13/info_day)"
          for i in $(seq 1 5); do
            echo "::group::итерация $i $(date -u +%T)"
            curl -sS -m 40 -A "$UA" "https://gdebenz.org/api/stations?lat1=55.15&lat2=56.25&lon1=36.5&lon2=38.75" -o src_gdebenz.json || echo "gdebenz fail"
            curl -sS -m 40 -A "$UA" "https://gdebenzi.ru/api/stations.php?bbox=36.5,55.15,38.75,56.25" -o src_gdebenzi.json || echo "gdebenzi fail"
            curl -sS -m 40 -A "$UA" "https://xn--80aaapn8cdd.xn--p1ai/api/stations?minLat=55.15&maxLat=56.25&minLng=36.5&maxLng=38.75" -o src_azsradar.json || echo "azsradar fail"
            curl -sS -m 40 -A "$UA" "https://benzrf.ru/api/stations?bbox=55.15,36.5,56.25,38.75" -o src_benzrf.json || echo "benzrf fail"
            python3 merge.py || echo "merge fail"
            git add live.json
            if git commit -m "live: агрегат $(date -u +%FT%TZ)"; then
              git pull --rebase -X ours origin master 2>/dev/null || git rebase --abort 2>/dev/null || true
              git push origin master || { git pull --rebase -X ours origin master 2>/dev/null; git push origin master || echo "push не удался"; }
            else
              echo "без изменений"
            fi
            echo "::endgroup::"
            [ "$i" -lt 5 ] && sleep 300 || true
          done
      - name: Self-restart (chain via PAT)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run poll-gdebenz -R hulapik13/info_day && echo "следующий прогон поставлен в очередь"
          else
            echo "секрет PAT не задан — самоперезапуск пропущен (останется только расписание)"
          fi
