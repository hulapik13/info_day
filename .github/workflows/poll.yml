name: poll-gdebenz
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - name: Poll 3 sources every 5 min for ~30 min
        run: |
          git config user.name "poller"
          git config user.email "actions@github.com"
          UA="info_day/1.0 (+github.com/hulapik13/info_day)"
          for i in $(seq 1 6); do
            echo "::group::итерация $i $(date -u +%T)"
            curl -sS -m 40 -A "$UA" "https://gdebenz.org/api/stations?lat1=55.15&lat2=56.25&lon1=36.5&lon2=38.75" -o src_gdebenz.json || echo "gdebenz fail"
            curl -sS -m 40 -A "$UA" "https://gdebenzi.ru/api/stations.php?bbox=36.5,55.15,38.75,56.25" -o src_gdebenzi.json || echo "gdebenzi fail"
            curl -sS -m 40 -A "$UA" "https://xn--80aaapn8cdd.xn--p1ai/api/stations?minLat=55.15&maxLat=56.25&minLng=36.5&maxLng=38.75" -o src_azsradar.json || echo "azsradar fail"
            python3 merge.py || echo "merge fail"
            git add live.json
            git commit -m "live: агрегат $(date -u +%FT%TZ)" && git push || echo "без изменений"
            echo "::endgroup::"
            [ "$i" -lt 6 ] && sleep 300 || true
          done
