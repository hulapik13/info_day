<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Бензин-радар — Москва</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛽</text></svg>">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{--bg:#12141a;--panel:#1b1f28;--line:#2c323f;--tx:#e7eaf0;--mut:#9aa4b2;--acc:#ffb020;--g:#28c76f;--r:#ff5a5a;--y:#ffc63d;--o:#ff8a3d;--blue:#2b9bf4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow-x:hidden;font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);overscroll-behavior:none}
#wrap{display:flex;flex-direction:column;height:100dvh}
#top{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 10px;z-index:1000}
.trow{display:flex;align-items:center;gap:8px}
.brand{font-size:15px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;flex:0 0 auto}
.upd{color:var(--mut);font-size:11px;line-height:1.15;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd b{color:var(--g);font-weight:500}
#togg{flex:0 0 auto;background:var(--acc);color:#231800;border:none;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
#drawer{display:none;margin-top:8px}
#drawer.open{display:block}
input[type=search]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0f1218;color:var(--tx);font-size:16px;margin-bottom:8px}
.sect{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:8px 0 5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:18px;border:1px solid var(--line);background:#0f1218;color:var(--tx);font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--acc);color:#231800;border-color:transparent;font-weight:600}
.acts{display:flex;gap:7px;margin-top:10px}
.acts button{flex:1;padding:11px 8px;border-radius:10px;border:1px solid var(--line);background:#0f1218;color:var(--tx);font-size:14px;cursor:pointer}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin-top:10px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:middle}
#map{flex:1 1 auto;background:#0e1015}
#warn{background:rgba(255,90,90,.14);color:var(--r);font-size:12px;padding:6px 10px;display:none}
/* popup */
.leaflet-popup-content-wrapper{background:#1b1f28;color:var(--tx);border-radius:12px}
.leaflet-popup-tip{background:#1b1f28}
.leaflet-popup-content{margin:13px 14px;font-size:14px;min-width:230px;max-width:78vw}
.leaflet-popup-content a{color:var(--acc);text-decoration:none}
.pf{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fb{font-size:14px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid var(--line)}
.fb.g{color:var(--g);background:rgba(40,199,111,.15);border-color:rgba(40,199,111,.5)}
.fb.r{color:var(--r);background:rgba(255,90,90,.13);border-color:rgba(255,90,90,.5)}
.hdr{font-size:16px;font-weight:600}
.st{display:inline-block;font-size:12px;padding:3px 9px;border-radius:7px;margin:4px 0}
.price{font-size:12px;color:var(--mut)}.price td{padding:1px 10px 1px 0}
.dl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dl a{border:1px solid var(--line);background:#0f1218;border-radius:9px;padding:8px 10px;font-size:13px}
.frm{margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
.fuelrow{display:flex;align-items:center;gap:6px;margin:5px 0}.fuelrow .fn{width:38px;font-weight:600}
.mini{padding:6px 12px;font-size:14px;border-radius:8px;border:1px solid var(--line);background:#0f1218;color:var(--tx);cursor:pointer}
.mini.yes{background:rgba(40,199,111,.18);border-color:var(--g);color:var(--g)}
.mini.no{background:rgba(255,90,90,.16);border-color:var(--r);color:var(--r)}
.mini.sel{background:var(--acc);color:#231800;border-color:transparent;font-weight:600}
.frm input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#0f1218;color:var(--tx);font-size:15px;margin:5px 0}
.frm .primary{background:var(--acc);color:#231800;border:none;font-weight:600;padding:11px;border-radius:9px;width:100%;font-size:15px;cursor:pointer;margin-top:4px}
/* десктоп: панель слева */
@media(min-width:820px){
  #wrap{flex-direction:row}
  #top{flex:0 0 330px;width:330px;border-bottom:none;border-right:1px solid var(--line);overflow-y:auto}
  #togg{display:none}
  #drawer{display:block!important;margin-top:12px}
  .brand{font-size:18px}
}

#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:1500}
#backdrop.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(101%);transition:transform .26s cubic-bezier(.3,.8,.3,1);z-index:1600;max-height:78dvh;display:flex;flex-direction:column;box-shadow:0 -10px 34px rgba(0,0,0,.45)}
#sheet.on{transform:translateY(0)}
.handle{width:42px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 2px;flex:0 0 auto}
#sheetc{overflow-y:auto;padding:6px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheetX{position:absolute;top:8px;right:12px;width:34px;height:34px;border-radius:50%;background:#0f1218;border:1px solid var(--line);color:var(--tx);font-size:18px;cursor:pointer;line-height:1}
@media(min-width:820px){#sheet{left:auto;right:20px;bottom:20px;width:390px;border-radius:16px;max-height:82vh}#backdrop{background:transparent}}
</style></head><body>
<div id="wrap">
  <div id="top">
    <div class="trow">
      <span class="brand">⛽ Бензин-радар</span>
      <span style="flex:1;min-width:0"></span>
      <button id="togg">Фильтры</button>
    </div>
    <div class="upd" id="src" style="margin-top:3px">загрузка…</div>
    <div id="warn"></div>
    <div id="drawer">
      <input type="search" id="q" placeholder="Поиск: название, бренд, адрес…">
      <div class="sect">Статус наличия</div>
      <div class="chips" id="sts">
        <span class="chip" data-s="yes">🟢 есть</span><span class="chip" data-s="queue">🟡 очередь</span>
        <span class="chip" data-s="low">🟠 мало</span><span class="chip" data-s="no">🔴 нет</span></div>
      <div class="sect">Есть сейчас — топливо</div>
      <div class="chips" id="fuels">
        <span class="chip" data-f="92">92</span><span class="chip" data-f="95">95</span>
        <span class="chip" data-f="98">98</span><span class="chip" data-f="100">100</span>
        <span class="chip" data-f="ДТ">ДТ</span></div>
      <div class="acts"><button id="near">📍 Рядом</button><button id="traffic">🚦 Пробки</button><button id="yandex">🗺️ Яндекс</button></div>
      <div class="acts" style="margin-top:6px"><button id="reset" style="flex:1">Сбросить фильтры</button></div>
      <div class="leg">
        <span><i style="background:#28c76f"></i>есть</span><span><i style="background:#ffc63d"></i>очередь</span>
        <span><i style="background:#ff8a3d"></i>мало</span><span><i style="background:#ff5a5a"></i>нет</span>
        <span><i style="background:#6b7686"></i>нет данных</span><span>🔵 отметка друзей</span></div>
      <div id="stat" style="color:var(--mut);font-size:12px;margin-top:8px"></div>
    </div>
  </div>
  <div id="map"></div>
  <div id="trafficHint" style="display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--acc);color:var(--acc);padding:8px 14px;border-radius:20px;font-size:13px;z-index:1400;box-shadow:0 4px 16px rgba(0,0,0,.4)">🚦 приблизь карту</div>
</div>
<script src="vendor/leaflet.js"></script>
<script src="config.js?v=15"></script>
<script>
window.__fbReady=false;
(function(){var c=window.FIREBASE_CONFIG||{};if(!c.databaseURL)return;
  var s1=document.createElement('script');s1.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js';
  s1.onload=function(){var s2=document.createElement('script');s2.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js';
    s2.onload=function(){try{firebase.initializeApp(c);window.__db=firebase.database();window.__fbReady=true;if(window.initRealtime)initRealtime();}catch(e){console.error(e);}};document.head.appendChild(s2);};
  document.head.appendChild(s1);})();
</script>
<script src="app.js?v=15"></script>
<div id="backdrop" onclick="closeSheet()"></div>
<div id="sheet"><button class="sheetX" onclick="closeSheet()">✕</button><div class="handle"></div><div id="sheetc"></div></div>
</body></html>
